<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>macOS Liquid Glass</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍎</text></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Boot Screen -->
    <div id="boot-screen">
        <div class="boot-logo">
            <svg class="apple-logo" viewBox="0 0 170 170" xmlns="http://www.w3.org/2000/svg">
                <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.2-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.28 2.13-9.54 3.25-12.8 3.35-4.93.21-9.84-1.96-14.75-6.52-3.13-2.73-7.05-7.41-11.76-14.04-5.05-7.08-9.2-15.29-12.45-24.65-3.47-10.2-5.2-20.07-5.2-29.59 0-10.95 2.36-20.4 7.08-28.3 3.71-6.36 8.65-11.37 14.83-15.04 6.19-3.67 12.88-5.54 20.1-5.67 3.92 0 9.06 1.21 15.43 3.59 6.36 2.39 10.44 3.6 12.24 3.6 1.34 0 5.87-1.42 13.56-4.25 7.27-2.63 13.4-3.72 18.42-3.28 13.61 1.1 23.84 6.47 30.63 16.15-12.17 7.38-18.19 17.72-18.07 31 .11 10.34 3.86 18.95 11.22 25.79 3.34 3.17 7.07 5.62 11.22 7.36-.9 2.61-1.85 5.11-2.86 7.51zM119.11 7.24c0 8.1-2.96 15.67-8.86 22.67-7.12 8.32-15.73 13.13-25.07 12.37a25.2 25.2 0 01-.19-3.07c0-7.78 3.39-16.1 9.4-22.9 3-3.44 6.82-6.31 11.45-8.6 4.62-2.26 8.99-3.51 13.1-3.71.12 1.1.17 2.2.17 3.24z" fill="white"/>
            </svg>
        </div>
        <div class="boot-progress">
            <div class="boot-progress-bar" id="boot-progress-bar"></div>
        </div>
        <div class="boot-text" id="boot-text">Đang khởi động...</div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" style="display:none">
        <div class="login-time" id="login-time"></div>
        <div class="login-date" id="login-date"></div>
        <div class="login-avatar">
            <div class="avatar-circle">👤</div>
            <div class="login-name">User</div>
            <div class="login-input-wrap">
                <input type="password" id="login-password" placeholder="Nhập mật khẩu..." class="login-input" value="">
                <button class="login-btn" id="login-btn">→</button>
            </div>
        </div>
    </div>

    <!-- Desktop -->
    <div id="desktop" style="display:none">
        <!-- Menu Bar -->
        <div id="menu-bar">
            <div class="menu-left">
                <span class="menu-apple" id="menu-apple-btn">&#63743;</span>
                <span class="menu-app-name" id="menu-app-name">Finder</span>
            </div>
            <div class="menu-right">
                <span class="menu-item" id="menu-wifi" title="Network">📶</span>
                <span class="menu-item" id="menu-battery" title="Battery">🔋</span>
                <span class="menu-item" id="menu-cpu-indicator" title="CPU Usage">⚡</span>
                <span class="menu-item menu-time" id="menu-time"></span>
            </div>
        </div>

        <!-- Apple Menu Dropdown -->
        <div id="apple-menu" class="dropdown-menu" style="display:none">
            <div class="dropdown-item" id="menu-about">Giới thiệu máy này</div>
            <div class="dropdown-separator"></div>
            <div class="dropdown-item" id="menu-settings">Cài đặt hệ thống...</div>
            <div class="dropdown-item" id="menu-appstore">App Store...</div>
            <div class="dropdown-separator"></div>
            <div class="dropdown-item" id="menu-sleep">Ngủ</div>
            <div class="dropdown-item" id="menu-restart">Khởi động lại</div>
            <div class="dropdown-item" id="menu-shutdown">Tắt máy</div>
        </div>

        <!-- Desktop Icons Container -->
        <div id="desktop-icons"></div>

        <!-- Windows Container -->
        <div id="windows-container"></div>

        <!-- Dock -->
        <div id="dock">
            <div id="dock-items"></div>
        </div>

        <!-- Notification Center -->
        <div id="notification-area"></div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/os-core.js"></script>
    <script src="js/system-services.js"></script>
    <script src="js/window-manager.js"></script>
    <script src="js/app-manager.js"></script>
    <script src="js/desktop.js"></script>
    <script src="js/save-system.js"></script>
    <script src="js/apps/finder.js"></script>
    <script src="js/apps/app-store.js"></script>
    <script src="js/apps/hardware-shop.js"></script>
    <script src="js/apps/task-manager.js"></script>
    <script src="js/apps/browser.js"></script>
    <script src="js/apps/ebook-reader.js"></script>
    <script src="js/apps/internet-manager.js"></script>
    <script src="js/apps/casino.js"></script>
    <script src="js/apps/asset-shop.js"></script>
    <script src="js/apps/zalo.js"></script>
    <script src="js/apps/settings.js"></script>
    <script src="js/apps/calculator.js"></script>
    <script src="js/apps/notes.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
